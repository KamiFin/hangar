services:
  mysql:
    image: mysql:8.4
    container_name: hangar-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hangar
      MYSQL_USER: hangar
      MYSQL_PASSWORD: hangar
    ports:
      - "3307:3306"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - hangar-data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uhangar", "-phangar"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  hangar-data:
